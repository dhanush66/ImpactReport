# Neo4j connection settings.
# The Bolt URI is composed as bolt://{neo4j.hostname}:{neo4j.port}.
# CLI flags (--neo4j / --user / --pass) override these values when provided.
neo4j.hostname=localhost
neo4j.port=7687
neo4j.username=neo4j
neo4j.password=neo4j-password

# Neo4j HTTP transport read timeout in milliseconds (analyze/ingest over the HTTP Cypher endpoint).
# Doubled from the previous 5 min default to 10 min. Raise further if analyze still times out.
neo4j.http.readTimeoutMs=600000
