# Spring Boot configuration for impact-cli web mode.
# Working dir is expected to be impact-cli/ when the JAR is launched, so
# logging.file.name=logs/... resolves to impact-cli/logs/. The directory is
# auto-created by Logback on first write.

# ── Logging ─────────────────────────────────────────────────────────────
logging.file.name=logs/impact-web.log
logging.file.path=logs
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
# Retain rotated logs for 30 days, cap each at 10 MB, total cap 500 MB.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.file-name-pattern=logs/impact-web-%d{yyyy-MM-dd}.%i.log.gz

# Console echo stays on — useful when running interactively. Disable later
# (`logging.pattern.console=`) once you're running as a service.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n

# Quieter defaults — pull Spring boilerplate out of the way of impact-cli's own logs.
logging.level.root=INFO
logging.level.io.spmp.impact=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.eclipse.jetty=WARN

# ── Temp / scratch directory ────────────────────────────────────────────
# Patch uploads, multipart spool files and remote-repo materialization scratch
# all land here rather than in %TEMP% / java.io.tmpdir, so they stay in one
# predictable place. Relative to the WORKING DIRECTORY, which the launchers
# (impact.cmd / impact.ps1 / impact.sh) set to the folder holding the jar — so
# the distribution stays portable. Override with an absolute path if needed:
#   java -jar impact.jar --impact.temp.dir=/var/lib/impact/tmp ...
impact.temp.dir=temp

# ── Multipart upload limits (patch files can be large for big diffs) ────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Spool multipart parts into the configured temp dir instead of %TEMP%.
spring.servlet.multipart.location=${impact.temp.dir}
